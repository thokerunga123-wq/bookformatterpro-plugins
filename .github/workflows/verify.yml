name: Verify plugin packages

# Actions minutes are used up: run by hand from the Actions tab, or use `node tools/ship.mjs` locally.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check every published package against its SHA-256
        run: node tools/verify.mjs
